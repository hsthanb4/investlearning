<svg viewBox="0 0 760 260" width="100%" height="260" xmlns="http://www.w3.org/2000/svg">
  <rect width="760" height="260" fill="#FAF8F5" rx="8" stroke="#E5DFD5" stroke-width="1"/>
  <text x="380" y="28" font-family="Newsreader, Georgia, serif" font-size="15" font-weight="700" fill="#1F1E1B" text-anchor="middle">大数定律与蒙特卡洛净值路径收敛扇形 (1000 次仿真)</text>

  <!-- Axes -->
  <line x1="70" y1="210" x2="700" y2="210" stroke="#A6A095" stroke-width="1.5"/>
  <line x1="70" y1="45" x2="70" y2="210" stroke="#A6A095" stroke-width="1.5"/>
  <text x="700" y="225" font-family="Inter, sans-serif" font-size="10" fill="#7D786F" text-anchor="end">交易笔数 N (0 ~ 500 次)</text>
  <text x="60" y="55" font-family="Inter, sans-serif" font-size="10" fill="#7D786F" text-anchor="end">累计净值</text>

  <!-- Convergence Cone / Fan -->
  <!-- Upper paths -->
  <path d="M 70 170 Q 300 130 700 45" fill="none" stroke="rgba(95, 115, 85, 0.25)" stroke-width="1.5"/>
  <path d="M 70 170 Q 350 140 700 75" fill="none" stroke="rgba(95, 115, 85, 0.4)" stroke-width="1.5"/>
  <!-- Median Expected Path (Sage Green) -->
  <path d="M 70 170 Q 380 140 700 95" fill="none" stroke="#5F7355" stroke-width="3"/>
  <!-- Lower paths -->
  <path d="M 70 170 Q 400 160 700 135" fill="none" stroke="rgba(95, 115, 85, 0.4)" stroke-width="1.5"/>
  <path d="M 70 170 Q 420 180 700 165" fill="none" stroke="rgba(204, 90, 54, 0.3)" stroke-width="1.5"/>

  <!-- High variance early zone -->
  <rect x="70" y="45" width="130" height="165" fill="rgba(204, 90, 54, 0.08)"/>
  <text x="135" y="70" font-family="Inter, sans-serif" font-size="10" fill="#CC5A36" text-anchor="middle">小样本震荡区</text>
  <text x="135" y="85" font-family="Inter, sans-serif" font-size="9" fill="#7D786F" text-anchor="middle">运气占主导 (N &lt; 30)</text>

  <!-- Law of large numbers convergence zone -->
  <rect x="480" y="45" width="220" height="165" fill="rgba(95, 115, 85, 0.08)"/>
  <text x="590" y="70" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#5F7355" text-anchor="middle">大数定律收敛区</text>
  <text x="590" y="88" font-family="JetBrains Mono, monospace" font-size="9" fill="#5F7355" text-anchor="middle">均值收敛于理论期望 μ·N</text>

  <!-- Point annotations -->
  <circle cx="700" cy="95" r="4" fill="#5F7355"/>
  <text x="690" y="112" font-family="JetBrains Mono, monospace" font-size="10" font-weight="600" fill="#5F7355" text-anchor="end">中位数路径 (Expected Drift)</text>
</svg>