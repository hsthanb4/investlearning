<svg viewBox="0 0 760 260" width="100%" height="260" xmlns="http://www.w3.org/2000/svg">
  <rect width="760" height="260" fill="#FAF8F5" rx="8" stroke="#E5DFD5" stroke-width="1"/>
  <text x="380" y="28" font-family="Newsreader, Georgia, serif" font-size="15" font-weight="700" fill="#1F1E1B" text-anchor="middle">交易风控守门员有限状态机 (Risk Guardian FSM Architecture)</text>

  <!-- State Nodes -->
  <!-- READY -->
  <rect x="40" y="80" width="130" height="60" rx="6" fill="#FAF8F5" stroke="#5F7355" stroke-width="2"/>
  <text x="105" y="105" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#5F7355" text-anchor="middle">READY</text>
  <text x="105" y="125" font-family="Inter, sans-serif" font-size="10" fill="#7D786F" text-anchor="middle">允许合规报单</text>

  <!-- IN_POSITION -->
  <rect x="250" y="80" width="140" height="60" rx="6" fill="#FAF8F5" stroke="#486A7D" stroke-width="2"/>
  <text x="320" y="105" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#486A7D" text-anchor="middle">IN_POSITION</text>
  <text x="320" y="125" font-family="Inter, sans-serif" font-size="10" fill="#7D786F" text-anchor="middle">监控止损/止盈</text>

  <!-- COOLDOWN -->
  <rect x="470" y="80" width="130" height="60" rx="6" fill="#FAF8F5" stroke="#C08535" stroke-width="2"/>
  <text x="535" y="105" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#C08535" text-anchor="middle">COOLDOWN</text>
  <text x="535" y="125" font-family="Inter, sans-serif" font-size="10" fill="#7D786F" text-anchor="middle">连续亏损锁定期</text>

  <!-- HALTED -->
  <rect x="620" y="170" width="110" height="60" rx="6" fill="#FAF8F5" stroke="#CC5A36" stroke-width="2"/>
  <text x="675" y="195" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#CC5A36" text-anchor="middle">HALTED</text>
  <text x="675" y="215" font-family="Inter, sans-serif" font-size="10" fill="#CC5A36" text-anchor="middle">日熔断终止</text>

  <!-- Transitions -->
  <!-- READY -> IN_POSITION -->
  <line x1="170" y1="110" x2="240" y2="110" stroke="#1F1E1B" stroke-width="1.5"/>
  <polygon points="245,110 237,106 237,114" fill="#1F1E1B"/>
  <text x="207" y="102" font-family="Inter, sans-serif" font-size="9" fill="#1F1E1B" text-anchor="middle">通过检查清单</text>

  <!-- IN_POSITION -> READY (Normal close) -->
  <path d="M 320 80 Q 212 40 105 80" fill="none" stroke="#5F7355" stroke-width="1.5"/>
  <polygon points="105,80 115,75 112,83" fill="#5F7355"/>
  <text x="212" y="52" font-family="Inter, sans-serif" font-size="9" fill="#5F7355" text-anchor="middle">盈利平仓 (胜率+1)</text>

  <!-- IN_POSITION -> COOLDOWN (Consecutive losses) -->
  <line x1="390" y1="110" x2="460" y2="110" stroke="#C08535" stroke-width="1.5"/>
  <polygon points="465,110 457,106 457,114" fill="#C08535"/>
  <text x="427" y="102" font-family="Inter, sans-serif" font-size="9" fill="#C08535" text-anchor="middle">亏损≥2次</text>

  <!-- COOLDOWN -> READY (Timer expires) -->
  <path d="M 535 140 Q 320 200 105 140" fill="none" stroke="#7D786F" stroke-width="1.5" stroke-dasharray="3 3"/>
  <polygon points="105,140 110,148 116,142" fill="#7D786F"/>
  <text x="320" y="195" font-family="Inter, sans-serif" font-size="9" fill="#7D786F" text-anchor="middle">冷静倒计时归零 (Tick Cooldown)</text>

  <!-- IN_POSITION / COOLDOWN -> HALTED (Max daily loss) -->
  <path d="M 570 140 Q 640 140 675 165" fill="none" stroke="#CC5A36" stroke-width="2"/>
  <polygon points="675,165 670,157 678,160" fill="#CC5A36"/>
  <text x="655" y="135" font-family="Inter, sans-serif" font-size="9" font-weight="600" fill="#CC5A36" text-anchor="middle">单日亏损≥上限 (硬熔断)</text>
</svg>