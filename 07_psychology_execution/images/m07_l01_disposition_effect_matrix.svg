<svg viewBox="0 0 760 260" width="100%" height="260" xmlns="http://www.w3.org/2000/svg">
  <rect width="760" height="260" fill="#FAF8F5" rx="8" stroke="#E5DFD5" stroke-width="1"/>
  
  <!-- Header Title -->
  <text x="380" y="30" font-family="Newsreader, Georgia, serif" font-size="15" font-weight="700" fill="#1F1E1B" text-anchor="middle">Odean (1998) 处置效应账户状态空间拓扑 (PGR vs PLR)</text>
  
  <!-- Left: Realized Box -->
  <rect x="60" y="60" width="290" height="130" rx="6" fill="#FFFFFF" stroke="#486A7D" stroke-width="1.5"/>
  <rect x="60" y="60" width="290" height="28" rx="6" fill="#486A7D"/>
  <text x="205" y="78" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">已实现交易 (Realized Trades)</text>
  
  <rect x="80" y="100" width="115" height="40" rx="4" fill="#EBF2ED" stroke="#5F7355" stroke-width="1"/>
  <text x="137" y="118" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600" fill="#5F7355" text-anchor="middle">已实现盈利 (RG)</text>
  <text x="137" y="133" font-family="Inter, sans-serif" font-size="10" fill="#7D786F" text-anchor="middle">卖出价 &gt; 成本</text>

  <rect x="215" y="100" width="115" height="40" rx="4" fill="#FDF0ED" stroke="#CC5A36" stroke-width="1"/>
  <text x="272" y="118" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600" fill="#CC5A36" text-anchor="middle">已实现亏损 (RL)</text>
  <text x="272" y="133" font-family="Inter, sans-serif" font-size="10" fill="#7D786F" text-anchor="middle">卖出价 &lt; 成本</text>

  <text x="205" y="165" font-family="JetBrains Mono, monospace" font-size="11" fill="#486A7D" text-anchor="middle">PGR = ΣRG / (ΣRG + ΣPG)</text>

  <!-- Right: Paper Holdings Box -->
  <rect x="410" y="60" width="290" height="130" rx="6" fill="#FFFFFF" stroke="#C08535" stroke-width="1.5"/>
  <rect x="410" y="60" width="290" height="28" rx="6" fill="#C08535"/>
  <text x="555" y="78" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">未实现账面持仓 (Paper Positions)</text>
  
  <rect x="430" y="100" width="115" height="40" rx="4" fill="#FAF8F5" stroke="#5F7355" stroke-width="1"/>
  <text x="487" y="118" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600" fill="#5F7355" text-anchor="middle">账面盈利 (PG)</text>
  <text x="487" y="133" font-family="Inter, sans-serif" font-size="10" fill="#7D786F" text-anchor="middle">收盘价 &gt; 成本未卖</text>

  <rect x="565" y="100" width="115" height="40" rx="4" fill="#FAF8F5" stroke="#CC5A36" stroke-width="1"/>
  <text x="622" y="118" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600" fill="#CC5A36" text-anchor="middle">账面亏损 (PL)</text>
  <text x="622" y="133" font-family="Inter, sans-serif" font-size="10" fill="#7D786F" text-anchor="middle">收盘价 &lt; 成本死扛</text>

  <text x="555" y="165" font-family="JetBrains Mono, monospace" font-size="11" fill="#C08535" text-anchor="middle">PLR = ΣRL / (ΣRL + ΣPL)</text>

  <!-- Bottom Metric Banner -->
  <rect x="60" y="205" width="640" height="40" rx="6" fill="#FAF8F5" stroke="#1F1E1B" stroke-width="1"/>
  <text x="380" y="229" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="700" fill="#1F1E1B" text-anchor="middle">DE = PGR - PLR &gt; 0 ➔ 显著行为偏误：牛股早卖赚微利，熊股死扛输本金</text>
</svg>