<svg viewBox="0 0 760 260" width="100%" height="260" xmlns="http://www.w3.org/2000/svg">
  <rect width="760" height="260" fill="#FAF8F5" rx="8" stroke="#E5DFD5" stroke-width="1"/>
  <!-- Axis -->
  <line x1="60" y1="130" x2="700" y2="130" stroke="#A6A095" stroke-width="1.5"/>
  <line x1="380" y1="20" x2="380" y2="240" stroke="#A6A095" stroke-width="1.5"/>
  <polygon points="700,130 690,125 690,135" fill="#A6A095"/>
  <polygon points="380,20 375,30 385,30" fill="#A6A095"/>
  
  <text x="695" y="122" font-family="Inter, sans-serif" font-size="11" fill="#7D786F" text-anchor="end">真实损益 ΔW (+)</text>
  <text x="65" y="122" font-family="Inter, sans-serif" font-size="11" fill="#7D786F">真实亏损 -ΔW (-)</text>
  <text x="370" y="32" font-family="Inter, sans-serif" font-size="11" fill="#7D786F" text-anchor="end">主观效用 V(+)</text>
  <text x="370" y="235" font-family="Inter, sans-serif" font-size="11" fill="#7D786F" text-anchor="end">心理痛苦 V(-)</text>
  
  <!-- Reference Point (0,0) -->
  <circle cx="380" cy="130" r="4" fill="#1F1E1B"/>
  <text x="390" y="145" font-family="JetBrains Mono, monospace" font-size="10" fill="#1F1E1B">参考点 (成本价 = 0)</text>

  <!-- Gains: Concave Curve (Sage Green) -->
  <path d="M 380 130 Q 480 70 650 50" fill="none" stroke="#5F7355" stroke-width="2.5"/>
  <circle cx="530" cy="80" r="4" fill="#5F7355"/>
  <text x="540" y="75" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#5F7355">盈利区：凹函数 (边际效用递减)</text>
  <text x="540" y="92" font-family="JetBrains Mono, monospace" font-size="10" fill="#7D786F">v''(x) &lt; 0 ➔ 急于锁定微利 (风险厌恶)</text>

  <!-- Losses: Convex Curve (Terracotta, 2.25x steeper) -->
  <path d="M 150 235 Q 260 215 380 130" fill="none" stroke="#CC5A36" stroke-width="2.5"/>
  <circle cx="250" cy="205" r="4" fill="#CC5A36"/>
  <text x="140" y="185" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#CC5A36">亏损区：凸函数 (斜率陡峭 λ ≈ 2.25)</text>
  <text x="140" y="202" font-family="JetBrains Mono, monospace" font-size="10" fill="#7D786F">v''(x) &gt; 0 ➔ 死扛摊平博反弹 (风险偏好)</text>

  <!-- Formula Callout -->
  <rect x="420" y="210" width="310" height="35" rx="5" fill="#FAF8F5" stroke="#486A7D" stroke-width="1"/>
  <text x="575" y="232" font-family="JetBrains Mono, monospace" font-size="11" fill="#486A7D" text-anchor="middle">v(x) = x^0.88 (x≥0) ; -2.25(-x)^0.88 (x&lt;0)</text>
</svg>