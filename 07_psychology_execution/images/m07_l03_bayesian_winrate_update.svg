<svg viewBox="0 0 760 260" width="100%" height="260" xmlns="http://www.w3.org/2000/svg">
  <rect width="760" height="260" fill="#FAF8F5" rx="8" stroke="#E5DFD5" stroke-width="1"/>
  <text x="380" y="28" font-family="Newsreader, Georgia, serif" font-size="15" font-weight="700" fill="#1F1E1B" text-anchor="middle">胜率贝叶斯共轭更新概率分布 (Beta-Binomial Conjugate Model)</text>

  <!-- Axes -->
  <line x1="80" y1="210" x2="680" y2="210" stroke="#A6A095" stroke-width="1.5"/>
  <line x1="80" y1="50" x2="80" y2="210" stroke="#A6A095" stroke-width="1.5"/>
  <text x="680" y="225" font-family="Inter, sans-serif" font-size="10" fill="#7D786F" text-anchor="end">真实胜率 p (0.0 ~ 1.0)</text>
  <text x="70" y="55" font-family="Inter, sans-serif" font-size="10" fill="#7D786F" text-anchor="end">概率密度 f(p)</text>

  <!-- Prior Beta(2, 2) Flat Curve -->
  <path d="M 80 210 Q 380 140 680 210" fill="none" stroke="#A6A095" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="260" y="160" font-family="Inter, sans-serif" font-size="10" fill="#7D786F">弱先验 Beta(2,2)</text>

  <!-- Posterior after 3 wins 3 losses Beta(5, 5) -->
  <path d="M 120 210 Q 380 90 640 210" fill="none" stroke="#486A7D" stroke-width="2"/>
  <text x="440" y="115" font-family="Inter, sans-serif" font-size="10" fill="#486A7D">N=6 样本后验 Beta(5,5)</text>

  <!-- Converged Posterior after 50 trades Beta(32, 22) -->
  <path d="M 280 210 Q 420 40 560 210" fill="none" stroke="#5F7355" stroke-width="2.5"/>
  <circle cx="420" cy="55" r="4" fill="#5F7355"/>
  <text x="430" y="52" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#5F7355">大样本后验收敛 (E[p]=59%, 方差急剧压缩)</text>

  <!-- Formula Callout -->
  <rect x="100" y="70" width="220" height="50" rx="4" fill="#FAF8F5" stroke="#E5DFD5" stroke-width="1"/>
  <text x="210" y="90" font-family="JetBrains Mono, monospace" font-size="10" fill="#1F1E1B" text-anchor="middle">α_post = α_0 + Wins</text>
  <text x="210" y="108" font-family="JetBrains Mono, monospace" font-size="10" fill="#1F1E1B" text-anchor="middle">β_post = β_0 + Losses</text>
</svg>