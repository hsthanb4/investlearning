<svg viewBox="0 0 760 260" width="100%" height="260" xmlns="http://www.w3.org/2000/svg">
  <rect width="760" height="260" fill="#FAF8F5" rx="8" stroke="#E5DFD5" stroke-width="1"/>
  <text x="380" y="26" font-family="Newsreader, Georgia, serif" font-size="15" font-weight="700" fill="#1F1E1B" text-anchor="middle">莫布森过程 vs 结果决策四象限 (Michael Mauboussin Success Matrix)</text>

  <!-- Matrix Header labels -->
  <text x="245" y="55" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#5F7355" text-anchor="middle">好结果 (盈利 +PnL)</text>
  <text x="545" y="55" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#CC5A36" text-anchor="middle">坏结果 (亏损 -PnL)</text>
  
  <text x="70" y="105" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#486A7D" text-anchor="middle">好过程<tspan x="70" dy="16">(严格守纪)</tspan></text>
  <text x="70" y="185" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#C08535" text-anchor="middle">坏过程<tspan x="70" dy="16">(侥幸违规)</tspan></text>

  <!-- Quadrant 1: Deserved Success -->
  <rect x="120" y="70" width="250" height="75" rx="5" fill="#FAF8F5" stroke="#5F7355" stroke-width="1.5"/>
  <text x="245" y="95" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#5F7355" text-anchor="middle">理所应当的成功 (Deserved Success)</text>
  <text x="245" y="115" font-family="Inter, sans-serif" font-size="10" fill="#7D786F" text-anchor="middle">技能驱动 / 正期望长期复利基石</text>
  <text x="245" y="132" font-family="JetBrains Mono, monospace" font-size="10" fill="#5F7355" text-anchor="middle">坚持做 ➔ 几何级数财富增长</text>

  <!-- Quadrant 2: Bad Break -->
  <rect x="420" y="70" width="250" height="75" rx="5" fill="#FAF8F5" stroke="#486A7D" stroke-width="1.5"/>
  <text x="545" y="95" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#486A7D" text-anchor="middle">合理的代价 (Bad Break / Variance)</text>
  <text x="545" y="115" font-family="Inter, sans-serif" font-size="10" fill="#7D786F" text-anchor="middle">概率分布中的正常回撤 / 经商必要成本</text>
  <text x="545" y="132" font-family="JetBrains Mono, monospace" font-size="10" fill="#486A7D" text-anchor="middle">坦然接受 ➔ 杜绝报复性交易</text>

  <!-- Quadrant 3: Dumb Luck -->
  <rect x="120" y="155" width="250" height="75" rx="5" fill="#FAF8F5" stroke="#CC5A36" stroke-width="2"/>
  <text x="245" y="180" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#CC5A36" text-anchor="middle">最致命的毒药 (Dumb Luck)</text>
  <text x="245" y="200" font-family="Inter, sans-serif" font-size="10" fill="#7D786F" text-anchor="middle">死扛违规却侥幸暴赚 / 强化毒性神经回路</text>
  <text x="245" y="217" font-family="JetBrains Mono, monospace" font-size="10" fill="#CC5A36" text-anchor="middle">极度危险 ➔ 下次重仓必然穿仓</text>

  <!-- Quadrant 4: Poetic Justice -->
  <rect x="420" y="155" width="250" height="75" rx="5" fill="#FAF8F5" stroke="#1F1E1B" stroke-width="1.5"/>
  <text x="545" y="180" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1F1E1B" text-anchor="middle">合乎逻辑的惩罚 (Poetic Justice)</text>
  <text x="545" y="200" font-family="Inter, sans-serif" font-size="10" fill="#7D786F" text-anchor="middle">无规则无止损被市场直接击杀</text>
  <text x="545" y="217" font-family="JetBrains Mono, monospace" font-size="10" fill="#7D786F" text-anchor="middle">惨痛警钟 ➔ 倒逼自律系统构建</text>
</svg>