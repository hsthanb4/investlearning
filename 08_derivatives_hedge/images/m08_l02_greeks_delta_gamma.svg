<svg viewBox="0 0 760 260" width="100%" height="260" xmlns="http://www.w3.org/2000/svg">
  <rect width="760" height="260" fill="#FAF8F5" rx="8" stroke="#E5DFD5" stroke-width="1"/>
  <text x="380" y="26" font-family="Newsreader, Georgia, serif" font-size="15" font-weight="700" fill="#1F1E1B" text-anchor="middle">期权 Delta 灵敏度曲线与 Gamma 凸性加速度钟形分布</text>

  <!-- Left: Delta S-Curve -->
  <g transform="translate(60, 45)">
    <text x="140" y="16" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#486A7D" text-anchor="middle">Delta (一阶导 ∂V/∂S)</text>
    <line x1="20" y1="160" x2="270" y2="160" stroke="#A6A095" stroke-width="1"/>
    <line x1="20" y1="30" x2="20" y2="160" stroke="#A6A095" stroke-width="1"/>
    <text x="15" y="35" font-family="JetBrains Mono, monospace" font-size="9" fill="#7D786F" text-anchor="end">1.0</text>
    <text x="15" y="95" font-family="JetBrains Mono, monospace" font-size="9" fill="#7D786F" text-anchor="end">0.5</text>
    <text x="15" y="160" font-family="JetBrains Mono, monospace" font-size="9" fill="#7D786F" text-anchor="end">0.0</text>
    <line x1="20" y1="95" x2="270" y2="95" stroke="#E5DFD5" stroke-dasharray="2 2"/>

    <!-- Call Delta Curve (Slate Blue) -->
    <path d="M 30 155 Q 110 155 145 95 T 260 35" fill="none" stroke="#486A7D" stroke-width="2.5"/>
    <circle cx="145" cy="95" r="4" fill="#C08535"/>
    <text x="150" y="115" font-family="JetBrains Mono, monospace" font-size="9" font-weight="600" fill="#C08535">ATM (Δ ≈ 0.50)</text>

    <!-- OTM / ITM tags -->
    <text x="40" y="145" font-family="Inter, sans-serif" font-size="9" fill="#7D786F">OTM 虚值</text>
    <text x="250" y="50" font-family="Inter, sans-serif" font-size="9" fill="#5F7355" text-anchor="end">ITM 实值</text>
  </g>

  <!-- Right: Gamma Bell Curve -->
  <g transform="translate(420, 45)">
    <text x="140" y="16" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#5F7355" text-anchor="middle">Gamma (二阶导 ∂²V/∂S²)</text>
    <line x1="20" y1="160" x2="270" y2="160" stroke="#A6A095" stroke-width="1"/>
    <line x1="20" y1="30" x2="20" y2="160" stroke="#A6A095" stroke-width="1"/>
    <text x="15" y="35" font-family="JetBrains Mono, monospace" font-size="9" fill="#7D786F" text-anchor="end">Max</text>
    <text x="15" y="160" font-family="JetBrains Mono, monospace" font-size="9" fill="#7D786F" text-anchor="end">0.0</text>

    <!-- Gamma Bell Curve (Sage Green) -->
    <path d="M 30 158 Q 110 155 145 40 Q 180 155 260 158" fill="none" stroke="#5F7355" stroke-width="2.5"/>
    <circle cx="145" cy="40" r="4" fill="#CC5A36"/>
    <line x1="145" y1="40" x2="145" y2="160" stroke="#CC5A36" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="145" y="30" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#CC5A36" text-anchor="middle">ATM 峰值 (凸性最高)</text>

    <text x="145" y="180" font-family="Inter, sans-serif" font-size="9" fill="#7D786F" text-anchor="middle">标的价格 S 接近行权价 K 时加速度极值</text>
  </g>

  <!-- Bottom Annotation -->
  <text x="380" y="240" font-family="Newsreader, serif" font-size="11" font-style="italic" fill="#7D786F" text-anchor="middle">平值期权（ATM）临界点：Delta 对价格波动最敏感，Gamma 风险达到极值峰顶</text>
</svg>