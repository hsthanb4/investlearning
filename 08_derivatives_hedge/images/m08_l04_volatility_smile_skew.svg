<svg viewBox="0 0 760 260" width="100%" height="260" xmlns="http://www.w3.org/2000/svg">
  <rect width="760" height="260" fill="#FAF8F5" rx="8" stroke="#E5DFD5" stroke-width="1"/>
  <text x="380" y="26" font-family="Newsreader, Georgia, serif" font-size="15" font-weight="700" fill="#1F1E1B" text-anchor="middle">隐含波动率微笑 (Smile) 与权益指数左偏斜 (Crash Skew)</text>

  <!-- Axes -->
  <line x1="80" y1="210" x2="680" y2="210" stroke="#A6A095" stroke-width="1.5"/>
  <line x1="80" y1="45" x2="80" y2="210" stroke="#A6A095" stroke-width="1.5"/>
  <text x="680" y="225" font-family="Inter, sans-serif" font-size="10" fill="#7D786F" text-anchor="end">行权价 K (OTM Put ➔ ATM ➔ OTM Call)</text>
  <text x="70" y="50" font-family="Inter, sans-serif" font-size="10" fill="#7D786F" text-anchor="end">隐含波动率 IV (%)</text>

  <!-- ATM midline -->
  <line x1="380" y1="45" x2="380" y2="210" stroke="#E5DFD5" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="380" y="225" font-family="JetBrains Mono, monospace" font-size="10" fill="#7D786F" text-anchor="middle">ATM (K = S)</text>

  <!-- Symmetric Smile (Forex) - Slate Blue -->
  <path d="M 120 75 Q 380 180 640 75" fill="none" stroke="#486A7D" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="645" y="80" font-family="Inter, sans-serif" font-size="10" fill="#486A7D">外汇市场：对称微笑 (Smile)</text>

  <!-- Equity Index Crash Skew (Terracotta) -->
  <path d="M 100 65 Q 260 115 380 155 T 660 185" fill="none" stroke="#CC5A36" stroke-width="2.5"/>
  <circle cx="150" cy="85" r="4" fill="#CC5A36"/>
  <text x="160" y="80" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#CC5A36">虚值看跌 OTM Put 高溢价 (尾部防暴跌保险)</text>
  <text x="665" y="190" font-family="Inter, sans-serif" font-size="10" fill="#CC5A36">标普500：左偏斜 (Smirk / Skew)</text>

  <!-- Bottom Explanatory callout -->
  <text x="380" y="248" font-family="Inter, sans-serif" font-size="10" fill="#7D786F" text-anchor="middle">1987 黑色星期一后机构常年恐慌买入深度虚值 Put，彻底打破 BSM 对数正态恒定波动率假设</text>
</svg>