<svg viewBox="0 0 760 260" width="100%" height="260" xmlns="http://www.w3.org/2000/svg">
  <rect width="760" height="260" fill="#FAF8F5" rx="8" stroke="#E5DFD5" stroke-width="1"/>
  <text x="380" y="28" font-family="Newsreader, Georgia, serif" font-size="15" font-weight="700" fill="#1F1E1B" text-anchor="middle">做市商动态 Delta 中性对冲再平衡循环与 PnL 归因</text>

  <!-- Cycle Steps -->
  <!-- Step 1: Market moves -->
  <rect x="50" y="65" width="180" height="65" rx="6" fill="#FFFFFF" stroke="#486A7D" stroke-width="1.5"/>
  <text x="140" y="90" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#1F1E1B" text-anchor="middle">1. 标的价格移动 ΔS</text>
  <text x="140" y="112" font-family="JetBrains Mono, monospace" font-size="10" fill="#486A7D" text-anchor="middle">S_t ➔ S_{t+1}</text>

  <!-- Arrow -->
  <line x1="230" y1="97" x2="275" y2="97" stroke="#1F1E1B" stroke-width="1.5"/>
  <polygon points="280,97 272,93 272,101" fill="#1F1E1B"/>

  <!-- Step 2: Delta drifts -->
  <rect x="285" y="65" width="190" height="65" rx="6" fill="#FFFFFF" stroke="#CC5A36" stroke-width="1.5"/>
  <text x="380" y="90" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#1F1E1B" text-anchor="middle">2. Delta 发生漂移 (Gamma)</text>
  <text x="380" y="112" font-family="JetBrains Mono, monospace" font-size="10" fill="#CC5A36" text-anchor="middle">Δ_new = Δ_old + Γ · ΔS</text>

  <!-- Arrow -->
  <line x1="475" y1="97" x2="520" y2="97" stroke="#1F1E1B" stroke-width="1.5"/>
  <polygon points="525,97 517,93 517,101" fill="#1F1E1B"/>

  <!-- Step 3: Rebalance -->
  <rect x="530" y="65" width="180" height="65" rx="6" fill="#FFFFFF" stroke="#5F7355" stroke-width="1.5"/>
  <text x="620" y="90" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#1F1E1B" text-anchor="middle">3. 现货再平衡补足</text>
  <text x="620" y="112" font-family="JetBrains Mono, monospace" font-size="10" fill="#5F7355" text-anchor="middle">买入/卖出 (Δ_new - Δ_old)</text>

  <!-- Bottom PnL decomposition formula box -->
  <rect x="50" y="155" width="660" height="85" rx="6" fill="#FFFFFF" stroke="#1F1E1B" stroke-width="1.5"/>
  <text x="380" y="180" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="700" fill="#1F1E1B" text-anchor="middle">做市商离散对冲 PnL 泰勒展开全息解构</text>
  <text x="380" y="205" font-family="JetBrains Mono, monospace" font-size="12" fill="#1F1E1B" text-anchor="middle">ΔΠ ≈ ½ · Γ · S² · (σ_realized² - σ_implied²) · Δt - Trading Cost</text>
  <text x="380" y="228" font-family="Inter, sans-serif" font-size="10" fill="#7D786F" text-anchor="middle">买入低估隐含波动率，动态剥离方向 Delta，最终收益等于已实现波动率与隐含波动率的方差差额！</text>
</svg>