<svg viewBox="0 0 760 260" width="100%" height="260" xmlns="http://www.w3.org/2000/svg">
  <rect width="760" height="260" fill="#FAF8F5" rx="8" stroke="#E5DFD5" stroke-width="1"/>
  <text x="380" y="26" font-family="Newsreader, Georgia, serif" font-size="15" font-weight="700" fill="#1F1E1B" text-anchor="middle">CBOE VIX 指数无模型方差互换 (Model-Free Variance Swap) 静态期权链加权积分</text>

  <!-- Left: Inverse Strike Squared Weighting Curve -->
  <g transform="translate(60, 45)">
    <line x1="20" y1="160" x2="300" y2="160" stroke="#A6A095" stroke-width="1"/>
    <line x1="20" y1="20" x2="20" y2="160" stroke="#A6A095" stroke-width="1"/>
    <text x="300" y="175" font-family="Inter, sans-serif" font-size="9" fill="#7D786F" text-anchor="end">行权价 K</text>
    <text x="15" y="25" font-family="Inter, sans-serif" font-size="9" fill="#7D786F" text-anchor="end">权重 1/K²</text>

    <!-- 1/K^2 hyperbola curve -->
    <path d="M 30 30 Q 70 120 290 155" fill="none" stroke="#CC5A36" stroke-width="2.5"/>
    <text x="120" y="60" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#CC5A36">权重权重 w(K) = ΔK / K²</text>
    <text x="120" y="80" font-family="Inter, sans-serif" font-size="10" fill="#7D786F">行权价越低，期权在 VIX 计算中权重越高！</text>
  </g>

  <!-- Right: VIX Index Formula Box -->
  <g transform="translate(400, 50)">
    <rect width="310" height="155" rx="6" fill="#FFFFFF" stroke="#486A7D" stroke-width="1.5"/>
    <rect width="310" height="26" rx="6" fill="#486A7D"/>
    <text x="155" y="18" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">CBOE 30天公允方差复制公式</text>
    
    <text x="155" y="55" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#1F1E1B" text-anchor="middle">σ² = (2/T) · e^(rT) · Σ [ΔK_i / K_i² · Q(K_i)]</text>
    <text x="155" y="75" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#1F1E1B" text-anchor="middle">- (1/T) · [F/K_0 - 1]²</text>

    <line x1="20" y1="90" x2="290" y2="90" stroke="#E5DFD5"/>
    <text x="155" y="112" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" fill="#5F7355" text-anchor="middle">VIX = 100 × √σ²</text>
    <text x="155" y="135" font-family="Inter, sans-serif" font-size="10" fill="#7D786F" text-anchor="middle">完全不依赖 BSM 模型任何假设，纯无模型复制！</text>
  </g>

  <!-- Bottom Tip -->
  <text x="380" y="240" font-family="Newsreader, serif" font-size="11" font-style="italic" fill="#7D786F" text-anchor="middle">VIX 期货通常处于远月升水（Contango），做多 VIX 产品（UVXY）面临极高的展期月度摩擦耗损</text>
</svg>