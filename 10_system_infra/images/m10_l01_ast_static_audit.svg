<svg viewBox="0 0 760 260" width="100%" height="260" xmlns="http://www.w3.org/2000/svg">
  <rect width="760" height="260" fill="#FAF8F5" rx="8" stroke="#E5DFD5" stroke-width="1"/>
  <text x="380" y="26" font-family="Newsreader, Georgia, serif" font-size="15" font-weight="700" fill="#1F1E1B" text-anchor="middle">Python AST 抽象语法树未来函数代码静态审计拓扑</text>

  <!-- Left: Source Code Box -->
  <g transform="translate(40, 50)">
    <rect width="210" height="150" rx="5" fill="#FFFFFF" stroke="#486A7D" stroke-width="1.5"/>
    <rect width="210" height="24" rx="5" fill="#486A7D"/>
    <text x="105" y="17" font-family="JetBrains Mono, monospace" font-size="11" fill="#FFFFFF" text-anchor="middle">Strategy Code (源码)</text>
    <text x="15" y="45" font-family="JetBrains Mono, monospace" font-size="10" fill="#1F1E1B">df['ret'] = df['close']</text>
    <text x="35" y="65" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#CC5A36">.shift(-1)  # 致命!</text>
    <text x="15" y="90" font-family="JetBrains Mono, monospace" font-size="10" fill="#1F1E1B">df['ma'] = df['close']</text>
    <text x="35" y="110" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#CC5A36">.rolling(center=True)</text>
    <text x="15" y="135" font-family="JetBrains Mono, monospace" font-size="10" fill="#CC5A36">df['sig'] = df.bfill()</text>
  </g>

  <!-- Arrow -->
  <line x1="255" y1="125" x2="295" y2="125" stroke="#1F1E1B" stroke-width="1.5"/>
  <polygon points="300,125 292,121 292,129" fill="#1F1E1B"/>
  <text x="277" y="115" font-family="Newsreader, serif" font-size="10" font-style="italic" fill="#7D786F" text-anchor="middle">ast.parse()</text>

  <!-- Middle: AST Syntax Tree Nodes -->
  <g transform="translate(305, 50)">
    <rect width="210" height="150" rx="5" fill="#FFFFFF" stroke="#1F1E1B" stroke-width="1.5"/>
    <rect width="210" height="24" rx="5" fill="#1F1E1B"/>
    <text x="105" y="17" font-family="JetBrains Mono, monospace" font-size="11" fill="#FFFFFF" text-anchor="middle">AST Node Visitor (遍历)</text>
    
    <rect x="15" y="35" width="180" height="30" rx="3" fill="#FAF8F5" stroke="#E5DFD5"/>
    <text x="25" y="54" font-family="JetBrains Mono, monospace" font-size="10" fill="#1F1E1B">Call: func.attr == 'shift'</text>

    <rect x="15" y="73" width="180" height="30" rx="3" fill="#FAF8F5" stroke="#E5DFD5"/>
    <text x="25" y="92" font-family="JetBrains Mono, monospace" font-size="10" fill="#1F1E1B">UnaryOp: USub (-1)</text>

    <rect x="15" y="111" width="180" height="30" rx="3" fill="#FAF8F5" stroke="#E5DFD5"/>
    <text x="25" y="130" font-family="JetBrains Mono, monospace" font-size="10" fill="#1F1E1B">keyword: 'center'==True</text>
  </g>

  <!-- Arrow -->
  <line x1="520" y1="125" x2="560" y2="125" stroke="#CC5A36" stroke-width="1.5"/>
  <polygon points="565,125 557,121 557,129" fill="#CC5A36"/>
  <text x="542" y="115" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#CC5A36" text-anchor="middle">拦截报警</text>

  <!-- Right: Audit Verdict -->
  <g transform="translate(570, 50)">
    <rect width="150" height="150" rx="5" fill="#FAF8F5" stroke="#CC5A36" stroke-width="2"/>
    <text x="75" y="25" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#CC5A36" text-anchor="middle">⛔ 审计违规拦截</text>
    
    <text x="15" y="55" font-family="JetBrains Mono, monospace" font-size="9" font-weight="600" fill="#CC5A36">• NEGATIVE_SHIFT</text>
    <text x="15" y="80" font-family="JetBrains Mono, monospace" font-size="9" font-weight="600" fill="#CC5A36">• CENTERED_WINDOW</text>
    <text x="15" y="105" font-family="JetBrains Mono, monospace" font-size="9" font-weight="600" fill="#CC5A36">• BACKFILL_LEAK</text>
    <text x="75" y="138" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#1F1E1B" text-anchor="middle">回测代码禁止提交生产</text>
  </g>

  <!-- Bottom Callout -->
  <text x="380" y="235" font-family="Inter, sans-serif" font-size="11" fill="#7D786F" text-anchor="middle">年化收益 200%、夏普 6.0 的神级回测，99.9% 都植入了隐蔽的未来函数或前视穿透</text>
</svg>