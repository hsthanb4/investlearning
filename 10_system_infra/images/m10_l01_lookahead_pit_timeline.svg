<svg viewBox="0 0 760 260" width="100%" height="260" xmlns="http://www.w3.org/2000/svg">
  <rect width="760" height="260" fill="#FAF8F5" rx="8" stroke="#E5DFD5" stroke-width="1"/>
  <text x="380" y="28" font-family="Newsreader, Georgia, serif" font-size="15" font-weight="700" fill="#1F1E1B" text-anchor="middle">Point-in-Time (PIT) 财报时序对齐与前视偏差 (Lookahead Bias) 隔离拓扑</text>

  <!-- Timeline Axis -->
  <line x1="60" y1="135" x2="700" y2="135" stroke="#1F1E1B" stroke-width="2"/>
  <polygon points="700,135 690,130 690,140" fill="#1F1E1B"/>
  <text x="700" y="152" font-family="JetBrains Mono, monospace" font-size="10" fill="#7D786F" text-anchor="end">时间轴 t</text>

  <!-- Point 1: Q1 Period End (3-31) -->
  <circle cx="160" cy="135" r="5" fill="#486A7D"/>
  <line x1="160" y1="75" x2="160" y2="195" stroke="#486A7D" stroke-width="1.5" stroke-dasharray="3 3"/>
  <rect x="75" y="55" width="170" height="30" rx="4" fill="#FFFFFF" stroke="#486A7D" stroke-width="1"/>
  <text x="160" y="74" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#486A7D" text-anchor="middle">一季报截止日 (3-31)</text>
  <text x="160" y="212" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#CC5A36" text-anchor="middle">【禁区】此时财报未公开</text>

  <!-- Lookahead Danger Zone Shading -->
  <rect x="165" y="110" width="280" height="25" fill="rgba(204, 90, 54, 0.18)" rx="3"/>
  <text x="305" y="127" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#CC5A36" text-anchor="middle">前视偏差黑洞 (Lookahead Bias Zone: 25天时滞)</text>

  <!-- Point 2: Actual Publish Date (4-25) -->
  <circle cx="450" cy="135" r="5" fill="#5F7355"/>
  <line x1="450" y1="75" x2="450" y2="195" stroke="#5F7355" stroke-width="1.5" stroke-dasharray="3 3"/>
  <rect x="365" y="55" width="170" height="30" rx="4" fill="#FFFFFF" stroke="#5F7355" stroke-width="1.5"/>
  <text x="450" y="74" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#5F7355" text-anchor="middle">实际法定披露日 (4-25)</text>
  <text x="450" y="212" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#5F7355" text-anchor="middle">【合规】信号在此日开盘首次可用</text>

  <!-- Point 3: Safe Trading Execution (4-26) -->
  <circle cx="610" cy="135" r="5" fill="#1F1E1B"/>
  <line x1="610" y1="85" x2="610" y2="185" stroke="#1F1E1B" stroke-width="1.5" stroke-dasharray="2 2"/>
  <text x="610" y="80" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600" fill="#1F1E1B" text-anchor="middle">T+1 撮合成交 (4-26)</text>
  <text x="610" y="202" font-family="Inter, sans-serif" font-size="10" fill="#7D786F" text-anchor="middle">严格因果律时间戳对齐</text>

  <!-- Bottom Principle Banner -->
  <rect x="60" y="225" width="640" height="25" rx="4" fill="#FAF8F5" stroke="#CC5A36" stroke-width="1"/>
  <text x="380" y="242" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#CC5A36" text-anchor="middle">因果律红线：在 t 时刻产生的任何特征，其真实物理发布时间戳必须严格小于 t (∂Signal_t / ∂X_{t+k} ≡ 0)</text>
</svg>