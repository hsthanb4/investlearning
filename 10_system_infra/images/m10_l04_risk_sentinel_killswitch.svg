<svg viewBox="0 0 760 260" width="100%" height="260" xmlns="http://www.w3.org/2000/svg">
  <rect width="760" height="260" fill="#FAF8F5" rx="8" stroke="#E5DFD5" stroke-width="1"/>
  <text x="380" y="28" font-family="Newsreader, Georgia, serif" font-size="15" font-weight="700" fill="#1F1E1B" text-anchor="middle">前置多维硬风控哨兵网关 (Risk Sentinel) 与心跳熔断 Kill-Switch</text>

  <!-- 4 Risk Defense Layers -->
  <!-- Layer 1 -->
  <g transform="translate(40, 60)">
    <rect width="150" height="120" rx="6" fill="#FFFFFF" stroke="#486A7D" stroke-width="1.5"/>
    <text x="75" y="25" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#486A7D" text-anchor="middle">层级 1: 乌龙指硬拦截</text>
    <text x="15" y="55" font-family="JetBrains Mono, monospace" font-size="9" fill="#1F1E1B">• 单笔金额 &le; 100万</text>
    <text x="15" y="75" font-family="JetBrains Mono, monospace" font-size="9" fill="#1F1E1B">• 单笔股数上限封顶</text>
    <text x="15" y="100" font-family="Inter, sans-serif" font-size="9" fill="#7D786F">杜绝敲错键盘乌龙指</text>
  </g>

  <!-- Layer 2 -->
  <g transform="translate(205, 60)">
    <rect width="150" height="120" rx="6" fill="#FFFFFF" stroke="#5F7355" stroke-width="1.5"/>
    <text x="75" y="25" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#5F7355" text-anchor="middle">层级 2: 标的池白名单</text>
    <text x="15" y="55" font-family="JetBrains Mono, monospace" font-size="9" fill="#CC5A36">• 禁止买入 ST/*ST</text>
    <text x="15" y="75" font-family="JetBrains Mono, monospace" font-size="9" fill="#CC5A36">• 停牌退市硬截断</text>
    <text x="15" y="100" font-family="Inter, sans-serif" font-size="9" fill="#7D786F">合规黑名单实时过滤</text>
  </g>

  <!-- Layer 3 -->
  <g transform="translate(370, 60)">
    <rect width="165" height="120" rx="6" fill="#FFFFFF" stroke="#C08535" stroke-width="1.5"/>
    <text x="82" y="25" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#C08535" text-anchor="middle">层级 3: 敞口集中度</text>
    <text x="15" y="55" font-family="JetBrains Mono, monospace" font-size="9" fill="#1F1E1B">• 单票持仓集中度 &le; 20%</text>
    <text x="15" y="75" font-family="JetBrains Mono, monospace" font-size="9" fill="#1F1E1B">• 总杠杆率上限 &le; 1.0x</text>
    <text x="15" y="100" font-family="Inter, sans-serif" font-size="9" fill="#7D786F">防止特质踩踏爆仓</text>
  </g>

  <!-- Layer 4: Kill Switch -->
  <g transform="translate(550, 60)">
    <rect width="170" height="120" rx="6" fill="#FDF0ED" stroke="#CC5A36" stroke-width="2"/>
    <text x="85" y="25" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#CC5A36" text-anchor="middle">层级 4: 紧急 Kill-Switch</text>
    <text x="15" y="55" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#CC5A36">• 日内亏损 &le; -3%</text>
    <text x="15" y="75" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#CC5A36">• 历史高点回撤 &le; -8%</text>
    <text x="15" y="95" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#CC5A36">• 心跳超时 &gt; 3.0s (COD)</text>
    <text x="85" y="115" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#CC5A36" text-anchor="middle">【强制物理撤单关机】</text>
  </g>

  <!-- Bottom Tip -->
  <text x="380" y="235" font-family="Inter, sans-serif" font-size="11" fill="#7D786F" text-anchor="middle">Cancel-on-Disconnect (COD)：一旦心跳丢失超过 3 秒，交易网关自动向交易所发起撤单，绝不留下裸露在途单</text>
</svg>