<svg viewBox="0 0 760 260" width="100%" height="260" xmlns="http://www.w3.org/2000/svg">
  <rect width="760" height="260" fill="#FAF8F5" rx="8" stroke="#E5DFD5" stroke-width="1"/>
  <text x="380" y="26" font-family="Newsreader, Georgia, serif" font-size="15" font-weight="700" fill="#1F1E1B" text-anchor="middle">交易执行引擎订单生命周期有限状态机 (Order FSM Lifecycle)</text>

  <!-- State Nodes -->
  <!-- 1. PENDING_SUBMIT -->
  <rect x="30" y="65" width="120" height="50" rx="5" fill="#FFFFFF" stroke="#486A7D" stroke-width="1.5"/>
  <text x="90" y="88" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#486A7D" text-anchor="middle">PENDING_SUBMIT</text>
  <text x="90" y="103" font-family="Inter, sans-serif" font-size="9" fill="#7D786F" text-anchor="middle">本地创建待发</text>

  <!-- Arrow -->
  <line x1="150" y1="90" x2="185" y2="90" stroke="#1F1E1B" stroke-width="1.5"/>
  <polygon points="190,90 182,86 182,94" fill="#1F1E1B"/>

  <!-- 2. SUBMITTED -->
  <rect x="195" y="65" width="105" height="50" rx="5" fill="#FFFFFF" stroke="#1F1E1B" stroke-width="1.5"/>
  <text x="247" y="88" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#1F1E1B" text-anchor="middle">SUBMITTED</text>
  <text x="247" y="103" font-family="Inter, sans-serif" font-size="9" fill="#7D786F" text-anchor="middle">已送柜台网关</text>

  <!-- Arrow -->
  <line x1="300" y1="90" x2="335" y2="90" stroke="#1F1E1B" stroke-width="1.5"/>
  <polygon points="340,90 332,86 332,94" fill="#1F1E1B"/>

  <!-- 3. ACCEPTED -->
  <rect x="345" y="65" width="105" height="50" rx="5" fill="#FFFFFF" stroke="#5F7355" stroke-width="1.5"/>
  <text x="397" y="88" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#5F7355" text-anchor="middle">ACCEPTED</text>
  <text x="397" y="103" font-family="Inter, sans-serif" font-size="9" fill="#7D786F" text-anchor="middle">交易所排队中</text>

  <!-- Arrow -->
  <line x1="450" y1="90" x2="480" y2="90" stroke="#1F1E1B" stroke-width="1.5"/>
  <polygon points="485,90 477,86 477,94" fill="#1F1E1B"/>

  <!-- 4. PARTIALLY_FILLED -->
  <rect x="490" y="65" width="115" height="50" rx="5" fill="#FFFFFF" stroke="#C08535" stroke-width="1.5"/>
  <text x="547" y="88" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#C08535" text-anchor="middle">PARTIAL_FILL</text>
  <text x="547" y="103" font-family="Inter, sans-serif" font-size="9" fill="#7D786F" text-anchor="middle">部分成交撮合</text>

  <!-- Arrow -->
  <line x1="605" y1="90" x2="635" y2="90" stroke="#5F7355" stroke-width="1.5"/>
  <polygon points="640,90 632,86 632,94" fill="#5F7355"/>

  <!-- 5. FILLED (Terminal) -->
  <rect x="645" y="65" width="85" height="50" rx="5" fill="#EBF2ED" stroke="#5F7355" stroke-width="2"/>
  <text x="687" y="88" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#5F7355" text-anchor="middle">FILLED</text>
  <text x="687" y="103" font-family="Inter, sans-serif" font-size="9" fill="#5F7355" text-anchor="middle">★终态</text>

  <!-- Rejections & Cancellations (Terminal States Below) -->
  <!-- REJECTED -->
  <rect x="150" y="165" width="100" height="45" rx="5" fill="#FDF0ED" stroke="#CC5A36" stroke-width="1.5"/>
  <text x="200" y="185" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#CC5A36" text-anchor="middle">REJECTED</text>
  <text x="200" y="200" font-family="Inter, sans-serif" font-size="8" fill="#CC5A36" text-anchor="middle">风控/交易所拒单(终态)</text>

  <path d="M 90 115 L 90 185 L 145 185" fill="none" stroke="#CC5A36" stroke-width="1.5"/>
  <path d="M 247 115 L 247 160" fill="none" stroke="#CC5A36" stroke-width="1.5"/>

  <!-- CANCELLED -->
  <rect x="440" y="165" width="105" height="45" rx="5" fill="#FAF8F5" stroke="#7D786F" stroke-width="1.5"/>
  <text x="492" y="185" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#7D786F" text-anchor="middle">CANCELLED</text>
  <text x="492" y="200" font-family="Inter, sans-serif" font-size="8" fill="#7D786F" text-anchor="middle">已成功撤销(终态)</text>

  <path d="M 397 115 L 397 185 L 435 185" fill="none" stroke="#7D786F" stroke-width="1.5"/>
  <path d="M 547 115 L 547 160" fill="none" stroke="#7D786F" stroke-width="1.5"/>

  <!-- Bottom Tip -->
  <text x="380" y="242" font-family="Inter, sans-serif" font-size="10" fill="#7D786F" text-anchor="middle">终态原则：FILLED, CANCELLED, REJECTED 属于严格吸收态，禁止发生任何次级状态转移！</text>
</svg>