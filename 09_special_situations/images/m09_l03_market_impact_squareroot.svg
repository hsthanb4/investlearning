<svg viewBox="0 0 760 260" width="100%" height="260" xmlns="http://www.w3.org/2000/svg">
  <rect width="760" height="260" fill="#FAF8F5" rx="8" stroke="#E5DFD5" stroke-width="1"/>
  <text x="380" y="26" font-family="Newsreader, Georgia, serif" font-size="15" font-weight="700" fill="#1F1E1B" text-anchor="middle">平方根市场冲击定律 (Square-Root Law) 与日均成交吸收天数 (Days of ADV)</text>

  <!-- Axes -->
  <line x1="80" y1="210" x2="680" y2="210" stroke="#A6A095" stroke-width="1.5"/>
  <line x1="80" y1="45" x2="80" y2="210" stroke="#A6A095" stroke-width="1.5"/>
  <text x="680" y="225" font-family="Inter, sans-serif" font-size="10" fill="#7D786F" text-anchor="end">被动买盘相对容量: Days of ADV (0 ~ 10 天)</text>
  <text x="70" y="55" font-family="Inter, sans-serif" font-size="10" fill="#7D786F" text-anchor="end">预期价格冲击 (%)</text>

  <!-- Square Root Curve (Sage Green) -->
  <path d="M 80 210 Q 200 130 380 95 T 670 65" fill="none" stroke="#5F7355" stroke-width="3"/>

  <!-- High impact points -->
  <circle cx="200" cy="140" r="4" fill="#5F7355"/>
  <line x1="200" y1="140" x2="200" y2="210" stroke="#5F7355" stroke-dasharray="2 2"/>
  <text x="200" y="130" font-family="JetBrains Mono, monospace" font-size="10" font-weight="600" fill="#5F7355" text-anchor="middle">1.0 天 ADV ➔ 冲击 +3.0%</text>

  <circle cx="500" cy="80" r="5" fill="#CC5A36"/>
  <line x1="500" y1="80" x2="500" y2="210" stroke="#CC5A36" stroke-dasharray="2 2"/>
  <text x="500" y="70" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#CC5A36" text-anchor="middle">5.0 天 ADV ➔ 冲击 +6.7% (高弹性标的)</text>

  <!-- Formula Callout -->
  <rect x="360" y="130" width="310" height="60" rx="5" fill="#FFFFFF" stroke="#486A7D" stroke-width="1.5"/>
  <text x="515" y="152" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#1F1E1B" text-anchor="middle">Impact = η · σ · √( Q_passive / ADV )</text>
  <text x="515" y="172" font-family="Inter, sans-serif" font-size="10" fill="#7D786F" text-anchor="middle">被动买入体量越大、标的日均成交越小，价格弹跳越剧烈！</text>
</svg>