<svg viewBox="0 0 760 260" width="100%" height="260" xmlns="http://www.w3.org/2000/svg">
  <rect width="760" height="260" fill="#FAF8F5" rx="8" stroke="#E5DFD5" stroke-width="1"/>
  <text x="380" y="28" font-family="Newsreader, Georgia, serif" font-size="15" font-weight="700" fill="#1F1E1B" text-anchor="middle">中国特色可转债“非对称多维期权”价值结构全息拓扑</text>

  <!-- Left: Bond Floor (Pure Debt) -->
  <rect x="50" y="60" width="200" height="135" rx="6" fill="#FFFFFF" stroke="#5F7355" stroke-width="2"/>
  <text x="150" y="85" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="700" fill="#5F7355" text-anchor="middle">1. 纯债底保护 (Bond Floor)</text>
  <text x="150" y="108" font-family="JetBrains Mono, monospace" font-size="11" fill="#1F1E1B" text-anchor="middle">到期本息贴现: 90~105 元</text>
  <text x="150" y="130" font-family="Inter, sans-serif" font-size="10" fill="#7D786F" text-anchor="middle">上市公司到期必须刚性兑付</text>
  <text x="150" y="150" font-family="Inter, sans-serif" font-size="10" fill="#7D786F" text-anchor="middle">跌破债底时提供高纯债收益率</text>
  <text x="150" y="175" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#5F7355" text-anchor="middle">【防守底线：跌有下界】</text>

  <!-- Middle: Conversion Option -->
  <rect x="280" y="60" width="200" height="135" rx="6" fill="#FFFFFF" stroke="#486A7D" stroke-width="2"/>
  <text x="380" y="85" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="700" fill="#486A7D" text-anchor="middle">2. 转股权 (Call Option)</text>
  <text x="380" y="108" font-family="JetBrains Mono, monospace" font-size="11" fill="#1F1E1B" text-anchor="middle">转股价值 CV = (S/K) · 100</text>
  <text x="380" y="130" font-family="Inter, sans-serif" font-size="10" fill="#7D786F" text-anchor="middle">正股大涨时转债跟涨</text>
  <text x="380" y="150" font-family="Inter, sans-serif" font-size="10" fill="#7D786F" text-anchor="middle">转股溢价率 CPR 反映跟涨弹性</text>
  <text x="380" y="175" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#486A7D" text-anchor="middle">【进攻动能：涨不封顶】</text>

  <!-- Right: Game Clauses (Down-revision & Call) -->
  <rect x="510" y="60" width="200" height="135" rx="6" fill="#FFFFFF" stroke="#CC5A36" stroke-width="2"/>
  <text x="610" y="85" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="700" fill="#CC5A36" text-anchor="middle">3. 中国特色博弈条款</text>
  <text x="610" y="108" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#5F7355" text-anchor="middle">下修条款 (Down-Revision):</text>
  <text x="610" y="125" font-family="Inter, sans-serif" font-size="10" fill="#7D786F" text-anchor="middle">正股阴跌时主动下调行权价K</text>
  <text x="610" y="145" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#CC5A36" text-anchor="middle">强赎条款 (Early Call):</text>
  <text x="610" y="162" font-family="Inter, sans-serif" font-size="10" fill="#7D786F" text-anchor="middle">涨超130%强制转股消除债务</text>
  <text x="610" y="180" font-family="Inter, sans-serif" font-size="9" fill="#CC5A36" text-anchor="middle">高溢价转债面临强赎杀溢价</text>

  <!-- Bottom Tip -->
  <text x="380" y="235" font-family="Inter, sans-serif" font-size="11" fill="#7D786F" text-anchor="middle">上市公司最大意愿是‘促进转股化解债务’而非到期掏出真金白银还本，造就了下修的博弈红利</text>
</svg>