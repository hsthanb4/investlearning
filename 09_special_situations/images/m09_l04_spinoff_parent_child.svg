<svg viewBox="0 0 760 260" width="100%" height="260" xmlns="http://www.w3.org/2000/svg">
  <rect width="760" height="260" fill="#FAF8F5" rx="8" stroke="#E5DFD5" stroke-width="1"/>
  <text x="380" y="28" font-family="Newsreader, Georgia, serif" font-size="15" font-weight="700" fill="#1F1E1B" text-anchor="middle">企业分拆 (Corporate Spinoff) 机构抛压错杀与价值重估双击拓扑</text>

  <!-- Left: Parent Conglomerate -->
  <rect x="50" y="60" width="180" height="135" rx="6" fill="#FFFFFF" stroke="#486A7D" stroke-width="1.5"/>
  <text x="140" y="85" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="700" fill="#1F1E1B" text-anchor="middle">多元化母公司 (Parent)</text>
  <text x="140" y="110" font-family="Inter, sans-serif" font-size="10" fill="#7D786F" text-anchor="middle">包含成熟低增长主业</text>
  <text x="140" y="130" font-family="Inter, sans-serif" font-size="10" fill="#CC5A36" text-anchor="middle">多元化折价 (Discount)</text>
  <text x="140" y="155" font-family="Inter, sans-serif" font-size="10" fill="#5F7355" text-anchor="middle">按比例派发子公司股票</text>
  <text x="140" y="175" font-family="JetBrains Mono, monospace" font-size="10" fill="#486A7D" text-anchor="middle">Spin-off 独立上市</text>

  <!-- Middle: Institutional Indiscriminate Selling -->
  <g transform="translate(260, 60)">
    <rect width="240" height="135" rx="6" fill="#FFFFFF" stroke="#CC5A36" stroke-width="1.5"/>
    <text x="120" y="85" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="700" fill="#CC5A36" text-anchor="middle">制度性无差别无脑抛售</text>
    <text x="120" y="110" font-family="Inter, sans-serif" font-size="10" fill="#7D786F" text-anchor="middle">1. 基金契约市值门槛（大盘转小盘）</text>
    <text x="120" y="130" font-family="Inter, sans-serif" font-size="10" fill="#7D786F" text-anchor="middle">2. 指数被动基金剔除非成分股</text>
    <text x="120" y="150" font-family="Inter, sans-serif" font-size="10" fill="#7D786F" text-anchor="middle">3. 机构投资者嫌碎股麻烦一键清仓</text>
    <text x="120" y="175" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#CC5A36" text-anchor="middle">【短期非理性压低股价 40%】</text>
  </g>

  <!-- Right: Value Double Engine -->
  <g transform="translate(530, 60)">
    <rect width="180" height="135" rx="6" fill="#FFFFFF" stroke="#5F7355" stroke-width="2"/>
    <text x="90" y="85" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="700" fill="#5F7355" text-anchor="middle">分拆子公司 (Spinoff Co)</text>
    <text x="90" y="110" font-family="Inter, sans-serif" font-size="10" fill="#1F1E1B" text-anchor="middle">摆脱母公司官僚束缚</text>
    <text x="90" y="130" font-family="Inter, sans-serif" font-size="10" fill="#5F7355" text-anchor="middle">管理层获丰厚股权期权激励</text>
    <text x="90" y="150" font-family="Inter, sans-serif" font-size="10" fill="#1F1E1B" text-anchor="middle">抛压消化后基本面释放</text>
    <text x="90" y="175" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#5F7355" text-anchor="middle">【迎来业绩与估值戴维斯双击】</text>
  </g>

  <!-- Bottom Tip -->
  <text x="380" y="235" font-family="Inter, sans-serif" font-size="11" fill="#7D786F" text-anchor="middle">乔尔·格林布拉特经典洞察：被机构出于非基本面原因抛售的优质孤儿股，是二级市场罕见的超额 Alpha 宝矿</text>
</svg>