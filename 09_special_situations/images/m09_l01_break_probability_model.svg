<svg viewBox="0 0 760 260" width="100%" height="260" xmlns="http://www.w3.org/2000/svg">
  <rect width="760" height="260" fill="#FAF8F5" rx="8" stroke="#E5DFD5" stroke-width="1"/>
  <text x="380" y="28" font-family="Newsreader, Georgia, serif" font-size="15" font-weight="700" fill="#1F1E1B" text-anchor="middle">并购利差隐含破裂概率与期望收益不对称天平</text>

  <!-- Left: Payoff Breakdown -->
  <g transform="translate(60, 55)">
    <rect width="290" height="135" rx="6" fill="#FFFFFF" stroke="#486A7D" stroke-width="1.5"/>
    <text x="145" y="25" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="700" fill="#1F1E1B" text-anchor="middle">损益不对称矩阵 (Asymmetric Payoff)</text>
    
    <rect x="20" y="40" width="250" height="35" rx="4" fill="#FAF8F5" stroke="#5F7355" stroke-width="1"/>
    <text x="30" y="62" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#5F7355">成功获利 (Spread)</text>
    <text x="250" y="62" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#5F7355" text-anchor="end">+$5.0 (+5.0%)</text>

    <rect x="20" y="85" width="250" height="35" rx="4" fill="#FAF8F5" stroke="#CC5A36" stroke-width="1"/>
    <text x="30" y="107" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#CC5A36">破裂下行 (Downside Loss)</text>
    <text x="250" y="107" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#CC5A36" text-anchor="end">-$20.0 (-20.0%)</text>

    <text x="145" y="132" font-family="Inter, sans-serif" font-size="10" fill="#7D786F" text-anchor="middle">赔率 b = 5 / 20 = 0.25 (赚小钱承担大风险)</text>
  </g>

  <!-- Right: Implied Probability Formula -->
  <g transform="translate(410, 55)">
    <rect width="290" height="135" rx="6" fill="#FFFFFF" stroke="#CC5A36" stroke-width="1.5"/>
    <text x="145" y="25" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="700" fill="#1F1E1B" text-anchor="middle">市场隐含交易破裂概率 (Implied Break)</text>

    <text x="145" y="55" font-family="JetBrains Mono, monospace" font-size="11" fill="#1F1E1B" text-anchor="middle">E[Payoff] = p · S - (1 - p) · L = 0</text>
    
    <rect x="20" y="70" width="250" height="40" rx="4" fill="#FAF8F5" stroke="#1F1E1B" stroke-width="1"/>
    <text x="145" y="88" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#CC5A36" text-anchor="middle">p_break = S / (S + L) = 5 / 25 = 20.0%</text>
    <text x="145" y="104" font-family="JetBrains Mono, monospace" font-size="10" fill="#5F7355" text-anchor="middle">盈亏平衡胜率 p_win = L / (S+L) = 80.0%</text>

    <text x="145" y="130" font-family="Inter, sans-serif" font-size="9" fill="#7D786F" text-anchor="middle">当前市价隐含市场认为有 20% 概率被反垄断否决</text>
  </g>

  <!-- Bottom Tip -->
  <text x="380" y="235" font-family="Inter, sans-serif" font-size="11" fill="#7D786F" text-anchor="middle">投决会准入铁律：主观估算通过概率必须显著高于盈亏平衡胜率（如 95% &gt; 80%），且严禁单票重仓</text>
</svg>